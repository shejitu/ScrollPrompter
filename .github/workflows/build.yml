name: Build ScrollPrompter APK

# 触发方式：
#   1) 推送到 main 分支时自动构建
#   2) 也可在 GitHub 网页 Actions 标签页手动点 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受许可并安装 SDK 组件
        run: |
          SDK="$ANDROID_HOME"
          (yes || true) | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses
          (yes || true) | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: 下载 Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 构建 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrollPrompter-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
