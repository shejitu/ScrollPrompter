name: Build ScrollPrompter APK

# 触发方式：
#   1) 推送到 main 分支时自动构建
#   2) 也可在 GitHub 网页 Actions 标签页手动点 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 该 action 会安装 SDK 命令行工具、把 sdkmanager 加入 PATH，并默认自动接受许可证
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 下载 Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: 构建 Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee /tmp/build.log

      # 失败时把关键错误输出为 ::error:: 注解（可通过 API 读取）
      - name: 输出错误详情（注解）
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          log = open('/tmp/build.log', encoding='utf-8', errors='replace').read()
          # 抓取关键错误段落
          chunks = []
          m = re.search(r'What went wrong:[\s\S]{0,3000}', log)
          if m: chunks.append(m.group(0))
          errs = [l for l in log.splitlines() if re.search(r'e: |error:|FAILURE|Caused by|Exception', l)]
          if errs:
              chunks.append('\n'.join(errs[-80:]))
          if not chunks:
              chunks.append('\n'.join(log.splitlines()[-120:]))
          text = '\n'.join(chunks)[-6000:]
          for i in range(0, len(text), 2800):
              part = text[i:i+2800]
              part = part.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::error::PART{i//2800}::{part}')
          EOF

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ScrollPrompter-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 构建成功后，把 APK 单独提交到 apk 分支（便于通过 Git API 取回）
      - name: 发布 APK 到 apk 分支
        if: success()
        run: |
          git config user.name "shejitu"
          git config user.email "shejitu@gmail.com"
          git checkout --orphan apk-publish
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp app/build/outputs/apk/debug/app-debug.apk ScrollPrompter.apk
          git add ScrollPrompter.apk
          git commit -m "APK build ${GITHUB_SHA}"
          git push -f origin apk-publish:apk
